name: Bygg Rymdakademin

# Körs när något i rymdakademin-src ändras. Bygger webbappen och Android-appen
# och lägger resultatet i mappen rymdakademin/, som GitHub Pages visar.
on:
  push:
    branches: [main]
    paths: ['rymdakademin-src/**', '.github/workflows/rymdakademin.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rymdakademin
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK-delar
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Bygg webbappen
        run: RYMD_VERSION="$(date +%Y.%m.%d)-${{ github.run_number }}" python3 rymdakademin-src/build.py

      - name: Bygg Android-appen
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_CODE=$((VERSION_CODE + 10))
          export VERSION_NAME="$(date +%Y.%m.%d)-${{ github.run_number }}"
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Hemligheten ANDROID_KEYSTORE_B64 saknas. Webbappen uppdateras men APK-filen behålls som den är."
          else
            bash rymdakademin-src/build_apk.sh
          fi

      - name: Lägg ut i rymdakademin/
        run: |
          mkdir -p rymdakademin
          [ -f rymdakademin/Rymdakademin.apk ] && cp rymdakademin/Rymdakademin.apk /tmp/old.apk || true
          find rymdakademin -mindepth 1 -delete
          cp -r rymdakademin-src/out/www/. rymdakademin/
          if [ -f rymdakademin-src/out/Rymdakademin.apk ]; then cp rymdakademin-src/out/Rymdakademin.apk rymdakademin/;
          elif [ -f /tmp/old.apk ]; then cp /tmp/old.apk rymdakademin/Rymdakademin.apk; fi

      - name: Spara
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rymdakademin
          git diff --cached --quiet && echo "Inget nytt att spara" || (git commit -m "Bygg Rymdakademin #${{ github.run_number }}" && git push)
