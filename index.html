<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fredrik Löfsten – appar</title>
<style>
:root{--bg:#F2F4F6;--fg:#14212B;--muted:#5B6873;--card:#fff;--line:#D3DADF;--accent:#1D5FA8}
@media (prefers-color-scheme:dark){:root{--bg:#0F161C;--fg:#E6ECF0;--muted:#94A3AE;--card:#18222B;--line:#2B3843;--accent:#6EA8E8;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:48px max(16px,env(safe-area-inset-left))}
h1{font-size:28px;margin:0 0 6px}
p{color:var(--muted);margin:0 0 24px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;color:var(--fg);text-decoration:none}
a.card b{display:block;font-size:18px;color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>Appar</h1>
  <p>Demoversioner att prova direkt i webbläsaren.</p>
  <a class="card" href="projekttavlan/"><b>Projekttavlan →</b>Arbetsordrar, tidrapportering, granskning och fakturor för hantverksföretag.</a>
</main>
</body>
</html>
